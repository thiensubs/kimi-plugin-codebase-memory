name: CI

# Tag pushes are deliberately excluded: `branches` alone ignores tag refs, and
# release.yml owns `v*` tags. Without this, every tag would run the matrix twice.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows starts hook commands through cmd.exe (`shell: true` in the hooks
  # runtime), so a .sh file cannot run there and the shipped binaries must be
  # .exe. This job proves the C sources build and behave on Windows; the shell
  # test suites stay on the POSIX cells because they assume sh.
  windows:
    name: windows-x86_64 (build + smoke)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          choco install mingw --no-progress -y
          echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build the two hooks
        run: |
          set -e
          mkdir -p bin/prebuilt/windows-x86_64
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Wall -Wextra \
            c/cbm_nudge.c -o bin/prebuilt/windows-x86_64/cbm_nudge.exe
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Wall -Wextra \
            c/secret_guard.c -o bin/prebuilt/windows-x86_64/secret_guard.exe
          file bin/prebuilt/windows-x86_64/*.exe

      - name: Smoke test the guard
        env:
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-code-home
        run: |
          set +e
          printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"path":"C:/Users/x/.kimi-code/config.toml"}}' \
            | ./bin/prebuilt/windows-x86_64/secret_guard.exe
          blocked=$?
          printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"path":"README.md"}}' \
            | ./bin/prebuilt/windows-x86_64/secret_guard.exe
          allowed=$?
          printf '%s' '{"hook_event_name":"UserPromptSubmit","prompt":[{"type":"text","text":"who calls parse_config"}]}' \
            | ./bin/prebuilt/windows-x86_64/cbm_nudge.exe > nudge.txt
          nudge=$?
          set -e
          [ "$blocked" = "2" ] || { echo "guard: expected block exit 2, got $blocked"; exit 1; }
          [ "$allowed" = "0" ] || { echo "guard: expected allow exit 0, got $allowed"; exit 1; }
          [ "$nudge" = "0" ] || { echo "nudge: expected exit 0, got $nudge"; exit 1; }
          grep -q "Structure question detected" nudge.txt || { echo "nudge printed nothing"; exit 1; }
          echo "windows smoke: block=$blocked allow=$allowed nudge=$nudge"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-windows-x86_64
          path: bin/prebuilt/windows-x86_64/
          if-no-files-found: error
          retention-days: 14

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels are pinned, never `-latest`: macos-13 is retired and
          # macos-14 is deprecated, so the current x64 macOS image is
          # macos-15-intel and the arm64 one is macos-15.
          - platform: linux-x86_64
            runs-on: ubuntu-24.04
          - platform: linux-arm64
            runs-on: ubuntu-24.04-arm
          - platform: darwin-x86_64
            runs-on: macos-15-intel
          - platform: darwin-arm64
            runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cc --version
          clang --version || true
          uname -a

      - name: Build C hooks
        run: ./.github/scripts/build-hooks.sh

      # .github/scripts/run-tests.sh runs tests/run-tests.sh when it exists and
      # each tests/test-*.sh otherwise; a checkout with no tests passes with a
      # notice, so this stays green while the suite lands in parallel.
      - name: Test
        env:
          # The hook binary appends parse-failure diagnostics under
          # $KIMI_CODE_HOME/logs. Point it at the runner's temp dir so it can
          # never touch a real home directory.
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-code-home
        run: ./.github/scripts/run-tests.sh

      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@v4
        with:
          # Only this platform's directory: bin/prebuilt/ also holds committed
          # binaries, and those must never be mistaken for this runner's build.
          name: prebuilt-${{ matrix.platform }}
          path: bin/prebuilt/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
